services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ckadinti
      POSTGRES_USER: ckadinti
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - teacher_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ckadinti -d ckadinti"]
      interval: 5s
      timeout: 5s
      retries: 10

  runtime-host:
    build:
      context: .
      dockerfile: docker/runtime.Dockerfile
    ports:
      - "4310:4310"
    environment:
      PORT: "4310"
      DATABASE_URL: postgres://ckadinti:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/ckadinti
      STUDENT_ORIGIN: http://localhost:4173
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4310/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  student:
    build:
      context: .
      dockerfile: docker/student.Dockerfile
    ports:
      - "4173:80"
    depends_on:
      runtime-host:
        condition: service_healthy

volumes:
  teacher_data:
