services:
  runtime-host:
    build:
      context: .
      dockerfile: docker/runtime.Dockerfile
    ports:
      - "4310:4310"
    environment:
      PORT: "4310"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4310/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  student:
    build:
      context: .
      dockerfile: docker/student.Dockerfile
    ports:
      - "4173:80"
    depends_on:
      runtime-host:
        condition: service_healthy
