name: CI

on:
  push:
    branches: ["v1", "main", "Arron", "Edin"]
  pull_request:
    branches: ["v1", "main", "Arron", "Edin"]

jobs:
  graphify-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[mcp,pdf,watch]"
          pip install pytest

      - name: Run tests
        run: |
          python -m pytest tests/ -q --tb=short

      - name: Verify install works end-to-end
        run: |
          graphify --help
          graphify install

  classroom-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ckadinti
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ckadinti"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ckadinti
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ckadinti
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply PostgreSQL migrations
        run: pnpm --filter @ckadinti/database db:migrate
      - name: Run tests
        run: pnpm test
      - name: Typecheck workspace
        run: pnpm typecheck
      - name: Package desktop app
        run: pnpm build
